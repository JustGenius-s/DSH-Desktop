<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
  <title>DSH-Desktop — 插件恢复</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    .recovery-shell {
      position: relative;
      height: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 36px 26px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 22px;
    }
    header { display: flex; align-items: center; gap: 20px; }
    header .brand-mark { width: 58px; height: 58px; flex: none; }
    .eyebrow { color: #a8bdd2; font-size: 12px; font-weight: 500; letter-spacing: .5px; }
    .eyebrow span { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); color: var(--muted); }
    h1 { margin-top: 7px; font-size: 29px; line-height: 1.25; font-weight: 650; letter-spacing: .2px; }
    .sub { margin-top: 9px; max-width: 660px; color: #a1adbb; font-size: 13px; line-height: 1.6; }
    .content { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .notice { flex: none; border: 1px solid rgba(212, 173, 123, .18); border-radius: 13px; background: rgba(160, 122, 73, .06); overflow: hidden; }
    summary { display: flex; align-items: center; gap: 12px; padding: 13px 17px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: rgba(212, 173, 123, .04); }
    .notice-symbol { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border: 1px solid rgba(212, 173, 123, .3); border-radius: 50%; color: #d4ad7b; font-size: 14px; font-weight: 600; }
    .notice-heading { flex: 1; min-width: 0; }
    .notice-heading strong { display: block; color: #d8c4a8; font-size: 12px; font-weight: 500; }
    .notice .suspected { display: block; margin-top: 4px; color: #a79f95; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .disclosure { display: flex; align-items: center; gap: 8px; flex: none; color: #a79f95; font-size: 11px; }
    .disclosure svg { width: 13px; height: 13px; transition: transform .16s; }
    details[open] .disclosure svg { transform: rotate(180deg); }
    .notice pre { margin: 0 17px 14px; padding: 12px 14px; border: 1px solid rgba(212, 173, 123, .1); border-radius: 8px; background: rgba(0, 0, 0, .18); font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9b4ad; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 110px; overflow: auto; user-select: text; }
    .plugins-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 15px; background: rgba(22, 28, 37, .7); overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, .08); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .panel-heading h2 { font-size: 13px; font-weight: 550; color: #d1dce7; }
    .panel-heading span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .plugin-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .row { display: flex; align-items: center; gap: 18px; min-height: 66px; padding: 12px 18px; border-bottom: 1px solid rgba(161, 186, 215, .07); }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: rgba(127, 178, 229, .035); }
    .row.suspected { background: rgba(212, 173, 123, .055); box-shadow: inset 2px 0 #bca07a; }
    .info { flex: 1; min-width: 0; }
    .name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; color: #dce5ee; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: text; }
    .row.disabled .name { color: #8b98a8; }
    .badges { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 7px; }
    .badges:empty { display: none; }
    .badge { font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 4px; color: #91a7bd; background: rgba(127, 178, 229, .075); }
    .badge.sus { color: #cfb28c; background: rgba(212, 173, 123, .09); }
    .badge.off { color: #8b98a8; background: rgba(139, 152, 168, .07); }
    .switch { position: relative; width: 36px; height: 21px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; }
    .slider { position: absolute; inset: 0; background: #343c46; border: 1px solid rgba(255, 255, 255, .06); border-radius: 999px; transition: background .16s; }
    .slider::before { content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px; border-radius: 50%; background: #c4d0dc; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .16s; }
    .switch input:checked + .slider { background: #6798c6; }
    .switch input:checked + .slider::before { transform: translateX(15px); background: #f0f5fa; }
    .switch input:disabled { cursor: not-allowed; }
    .switch input:disabled + .slider { opacity: .38; }
    footer { display: flex; align-items: center; gap: 16px; }
    .hint { flex: 1; min-width: 0; color: #929fae; font-size: 11px; line-height: 1.6; }
    .actions { display: flex; align-items: center; gap: 10px; flex: none; }
    button { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: rgba(30, 39, 50, .6); color: #b7c4d1; font-family: inherit; font-size: 12px; line-height: 1.5; padding: 10px 15px; border-radius: 9px; cursor: pointer; transition: background .16s, border-color .16s; }
    button:hover:not(:disabled) { background: rgba(48, 63, 80, .7); border-color: rgba(161, 186, 215, .25); }
    button.primary { background: linear-gradient(180deg, #91bce6, #6e9ecf); border-color: #92bde7; color: #102237; font-weight: 600; box-shadow: 0 3px 15px rgba(74, 138, 196, .15); }
    button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #a6ccf0, #7baddd); }
    button svg { width: 14px; height: 14px; }
    button:disabled { opacity: .38; cursor: default; }
    button:focus-visible, summary:focus-visible, .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 3px; }
    summary:focus-visible { outline-offset: -3px; border-radius: 12px; }
    .err { color: #e6afa2; font-size: 12px; line-height: 1.5; }
    .err:empty { display: none; }
    .empty { display: grid; place-items: center; min-height: 120px; height: 100%; padding: 24px; color: var(--muted); font-size: 13px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { border-radius: 8px; background: rgba(161, 186, 215, .2); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(161, 186, 215, .35); }
    @media (max-height: 570px), (max-width: 760px) {
      .recovery-shell { padding: 20px 24px; gap: 16px; }
      header { gap: 16px; }
      header .brand-mark { width: 46px; height: 46px; }
      h1 { font-size: 25px; margin-top: 5px; }
      .sub { font-size: 12px; margin-top: 7px; }
      .content { gap: 12px; }
      summary { padding: 11px 14px; }
      .panel-heading { padding: 11px 16px; }
      .row { padding: 10px 16px; min-height: 62px; }
      .notice pre { max-height: 80px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
  </style>
</head>
<body>
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>
  <div class="glow glow-3" aria-hidden="true"></div>

  <div class="recovery-shell">
    <header>
      <img class="brand-mark" src="whale.svg" alt="" />
      <div>
        <p class="eyebrow">DSH-Desktop<span>恢复与管理</span></p>
        <h1 class="brand-title" id="title">让 DSH 恢复运行</h1>
        <p class="sub" id="description">调整插件启用状态，然后重新启动。你的改动会自动保存。</p>
      </div>
    </header>

    <main class="content">
      <details class="notice" id="alert" hidden>
        <summary>
          <span class="notice-symbol" aria-hidden="true">!</span>
          <span class="notice-heading">
            <strong id="failure-label">故障信息</strong>
            <span class="suspected" id="suspected"></span>
          </span>
          <span class="disclosure">错误详情<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
        </summary>
        <pre id="detail" tabindex="0" aria-label="错误详情"></pre>
      </details>

      <section class="plugins-panel" aria-labelledby="plugins-title">
        <div class="panel-heading">
          <h2 id="plugins-title">插件管理</h2>
          <span id="count" aria-live="polite">正在读取…</span>
        </div>
        <div class="plugin-list" id="list"></div>
      </section>
      <div class="err" id="err" role="alert"></div>
    </main>

    <footer>
      <span class="hint" id="hint" aria-live="polite">插件更改即时保存，重启后生效</span>
      <div class="actions">
        <button id="clear">清除故障记录</button>
        <button class="primary" id="restart"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 6a5.25 5.25 0 1 0 .15 3.6M13 2.75V6H9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>重新启动</button>
      </div>
    </footer>
  </div>

  <script>
    const api = window.dshDesktop && window.dshDesktop.plugins
    if (!api) {
      document.getElementById('hint').textContent = '未检测到桌面插件 API（请从 DSH-Desktop 打开本页）'
      document.getElementById('restart').disabled = true
    }

    let plugins = []
    let failure = null
    const failureCopy = {
      startup: ['DSH 暂时无法启动', '查看故障信息，尝试关闭相关插件后重新启动。'],
      service: ['DSH 服务需要恢复', '服务意外停止了。你可以调整插件，或直接重新启动。'],
      renderer: ['DSH 界面需要恢复', '界面意外关闭了。查看错误详情，或重新启动应用恢复。'],
      plugin: ['某个插件界面出错了', '出错的界面已被隔离，其余功能仍可使用。你可以关闭此窗口继续工作。'],
    }

    function render() {
      const list = document.getElementById('list')
      list.replaceChildren()
      document.getElementById('count').textContent = plugins.filter(p => p.enabled).length + ' / ' + plugins.length + ' 已启用'
      if (plugins.length === 0) {
        const empty = document.createElement('p')
        empty.className = 'empty'
        empty.textContent = '暂无可管理的插件'
        list.appendChild(empty)
      }
      for (const p of [...plugins].sort((a, b) => Number(b.suspected) - Number(a.suspected))) {
        const row = document.createElement('div')
        row.className = 'row' + (p.suspected ? ' suspected' : '') + (p.enabled ? '' : ' disabled')

        const info = document.createElement('div')
        info.className = 'info'

        const name = document.createElement('div')
        name.className = 'name'
        name.textContent = p.name
        name.title = p.name

        const badges = document.createElement('div')
        badges.className = 'badges'
        if (p.core) badges.appendChild(badge('核心插件', 'core'))
        if (p.suspected) badges.appendChild(badge('疑似相关', 'sus'))
        if (!p.enabled) badges.appendChild(badge('已停用', 'off'))

        info.appendChild(name)
        info.appendChild(badges)

        const sw = document.createElement('label')
        sw.className = 'switch'
        const input = document.createElement('input')
        input.type = 'checkbox'
        input.setAttribute('role', 'switch')
        input.setAttribute('aria-label', p.name)
        if (p.core) sw.title = '核心插件需要保持启用'
        input.checked = p.enabled
        input.disabled = p.core
        input.addEventListener('change', () => {
          void setEnabled(p, input)
        })
        const slider = document.createElement('span')
        slider.className = 'slider'
        sw.appendChild(input)
        sw.appendChild(slider)

        row.appendChild(info)
        row.appendChild(sw)
        list.appendChild(row)
      }
    }

    function badge(text, cls) {
      const b = document.createElement('span')
      b.className = 'badge ' + cls
      b.textContent = text
      return b
    }

    function renderAlert() {
      const alert = document.getElementById('alert')
      document.getElementById('clear').disabled = failure === null
      if (failure) {
        const [title, description] = failureCopy[failure.kind]
        document.getElementById('title').textContent = title
        document.getElementById('description').textContent = description
        alert.hidden = false
        document.getElementById('failure-label').textContent = failure.suspected.length > 0
          ? '发现疑似相关插件' : '已记录故障信息'
        const suspected = document.getElementById('suspected')
        suspected.textContent = failure.suspected.length > 0 ? failure.suspected.join('、') : '暂未定位到具体插件，可展开详情查看'
        suspected.title = suspected.textContent
        document.getElementById('detail').textContent = failure.detail
      } else {
        alert.hidden = true
        alert.open = false
        document.getElementById('title').textContent = '让 DSH 恢复运行'
        document.getElementById('description').textContent = '调整插件启用状态，然后重新启动。你的改动会自动保存。'
      }
    }

    async function setEnabled(p, input) {
      const enabled = input.checked
      const r = await api.setEnabled(p.name, enabled)
      if (!r.ok) {
        document.getElementById('err').textContent = '设置失败：' + (r.error || p.name)
        input.checked = p.enabled // 还原
        return
      }
      p.enabled = enabled
      if (p.suspected && !enabled) p.suspected = false
      document.getElementById('err').textContent = ''
      render()
      document.getElementById('hint').textContent = '更改已保存，重新启动后生效'
    }

    async function refresh() {
      const data = await api.list()
      plugins = data.plugins
      failure = data.failure
      render()
      renderAlert()
    }

    document.getElementById('restart').addEventListener('click', () => {
      api.relaunch()
    })
    document.getElementById('clear').addEventListener('click', async () => {
      await api.clearFailure()
      document.getElementById('err').textContent = ''
    })

    if (api) {
      api.onFailureChanged(() => { void refresh() })
      void refresh()
    }
  </script>
</body>
</html>
