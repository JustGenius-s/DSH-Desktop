<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'none'; img-src 'self' data:" />
  <title>DSH-Desktop</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
      pointer-events: none;
    }

    .logo {
      width: 82px;
      height: 82px;
      filter: drop-shadow(0 0 20px rgba(83, 141, 202, .55));
      animation: breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(83, 141, 202, .4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 28px rgba(83, 141, 202, .7)); }
    }

    .title {
      margin-top: 26px;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: .6px;
    }

    .bar {
      position: relative;
      width: 300px;
      height: 3px;
      background: #1f2733;
      border-radius: 2px;
      margin: 26px auto 16px;
      overflow: hidden;
    }
    .bar::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #4a8ac4 30%, #7fb2e5 50%, transparent 100%);
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .status { font-size: 13px; color: var(--muted); letter-spacing: .3px; }
    @media (prefers-reduced-motion: reduce) { .logo, .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="wrap">
    <img class="logo brand-mark" src="whale.svg" alt="" />

    <h1 class="title brand-title">DSH-Desktop</h1>
    <div class="bar"></div>
    <div class="status" id="status">正在准备…</div>
  </div>
</body>
</html>
